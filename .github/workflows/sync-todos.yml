name: Sync todos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - todos.json
      - sync-config.json
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-todos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge the repo list with the live list
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            node scripts/sync-github.mjs
            if git diff --quiet -- todos.json; then
              echo "todos.json is current."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add todos.json
            git commit -m "Sync todos with Mike's devices"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected. Fetching latest and merging again."
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Could not push the synced list."
          exit 1
