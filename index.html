<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Work and personal to-dos — stays on this device" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Moh to do" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <title>There's always Moh to do</title>
  <style>
    :root {
      --bg: #000000;
      --bg-elevated: #0a0a0a;
      --bg-input: #111111;
      --surface: #141414;
      --border: #2a2a2a;
      --border-soft: #3a3a3a;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #ffffff;
      --accent-hover: #e8e8e8;
      --accent-soft: rgba(255, 255, 255, 0.12);
      --accent-on: #000000;
      --success: #ffffff;
      --danger: #ffffff;
      --danger-soft: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      --radius: 14px;
      --radius-sm: 10px;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --tap: 44px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --add-bar-h: calc(72px + var(--safe-bottom));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      padding:
        calc(12px + var(--safe-top))
        calc(12px + var(--safe-right))
        calc(var(--add-bar-h) + 12px)
        calc(12px + var(--safe-left));
      min-height: 100dvh;
      overscroll-behavior-y: contain;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      padding: 4px 4px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border-soft);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
      min-height: 28px;
    }

    h1 {
      font-size: clamp(1.35rem, 5.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-elevated);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      min-height: var(--tap);
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.02em;
    }

    .tab-btn + .tab-btn {
      border-left: 1px solid var(--border);
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-on);
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .count strong {
      color: var(--text);
      font-weight: 600;
    }

    .filters {
      display: flex;
      gap: 4px;
      background: var(--bg);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 280px;
      margin-left: auto;
    }

    .filter-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: var(--tap);
      padding: 8px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .filter-btn:hover {
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: var(--accent-on);
    }

    .list {
      list-style: none;
      min-height: 140px;
    }

    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .todo {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }

    .todo:last-child {
      border-bottom: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .check {
      flex-shrink: 0;
      width: var(--tap);
      height: var(--tap);
      border: 2px solid var(--border-soft);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 0.15s, background 0.15s;
      color: transparent;
    }

    .check:hover {
      border-color: var(--accent);
    }

    .todo.done .check {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-on);
    }

    .check svg {
      width: 18px;
      height: 18px;
    }

    .todo-body {
      flex: 1;
      min-width: 0;
      padding-top: 10px;
    }

    .todo-text {
      font-size: 1rem;
      word-wrap: break-word;
      cursor: text;
      padding: 2px 0;
      border-radius: 4px;
      min-height: 24px;
    }

    .todo.done .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
      opacity: 0.75;
    }

    .todo-edit {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      padding: 10px 12px;
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft);
      min-height: var(--tap);
    }

    .actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
      opacity: 1;
      padding-top: 2px;
    }

    .icon-btn {
      width: var(--tap);
      height: var(--tap);
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .icon-btn.delete:hover,
    .icon-btn.delete:focus-visible {
      background: var(--danger-soft);
      color: var(--text);
      outline: 1px solid var(--border-soft);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .footer-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .btn {
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      white-space: nowrap;
      min-height: var(--tap);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-on);
      padding: 0 20px;
      flex-shrink: 0;
      min-width: 72px;
      border: 1px solid var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      padding: 8px 12px;
      font-size: 0.8rem;
      min-height: 40px;
      border: 1px solid transparent;
    }

    .btn-ghost:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
    }

    .btn-danger-ghost:hover {
      color: var(--text);
      background: var(--danger-soft);
      border-color: var(--border-soft);
    }

    .add-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      padding:
        10px
        calc(12px + var(--safe-right))
        calc(10px + var(--safe-bottom))
        calc(12px + var(--safe-left));
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.72) 0%, var(--bg) 35%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
    }

    .add-bar-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .add-bar input {
      flex: 1;
      min-width: 0;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 16px;
      padding: 12px 14px;
      outline: none;
      min-height: var(--tap);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .add-bar input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    .add-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    @media (min-width: 480px) {
      .filters {
        width: auto;
        margin-left: 0;
      }

      .toolbar {
        flex-wrap: nowrap;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="badge">To-Do</div>
      <h1>There's always Moh to do</h1>
      <p class="subtitle">Work &amp; personal — stays on this device</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Lists">
      <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="work" id="tabWork">Work</button>
      <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="personal" id="tabPersonal">Personal</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <p class="count"><strong id="openCount">0</strong> open</p>
        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="open">Open</button>
          <button type="button" class="filter-btn" data-filter="done">Done</button>
        </div>
      </div>

      <ul class="list" id="todoList" aria-live="polite"></ul>

      <footer>
        <span class="footer-hint">Tap text to edit · saved locally · works offline</span>
        <button type="button" class="btn btn-ghost btn-danger-ghost" id="clearCompleted">Clear completed</button>
      </footer>
    </div>
  </div>

  <form class="add-bar" id="addForm" autocomplete="off">
    <div class="add-bar-inner">
      <input type="text" id="newTodo" placeholder="Add to Work…" maxlength="500" aria-label="New task" enterkeyhint="done" />
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>

  <script>
    (function () {
      const STORAGE_V2 = "moh-todos-v2";
      const STORAGE_V1 = "lvlup-todos-v1";
      const EDDIE = "Post Eddie Cha photo and tease update to black belt curriculum";

      const SEED_WORK = [
        "Invite parents to start week of October 19th",
        "Silver Kickers — 40+ workout and mixer",
        "2 more designs for shirts and hoodies in time for holiday sale",
        "Make each level of certification last one cycle — may need intermediary levels between the 3 collars",
        "Order LVLUP branded pens",
        "Booths — donate $20 and we will give you a free uniform and a month as a thank you",
        EDDIE
      ];

      let lists = { work: [], personal: [] };
      let activeTab = "work";
      let filter = "all";
      let editingId = null;

      const listEl = document.getElementById("todoList");
      const openCountEl = document.getElementById("openCount");
      const addForm = document.getElementById("addForm");
      const newTodoInput = document.getElementById("newTodo");
      const clearBtn = document.getElementById("clearCompleted");

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function todos() {
        return lists[activeTab] || [];
      }

      function setTodos(next) {
        lists[activeTab] = next;
      }

      function ensureEddie(list) {
        var has = list.some(function (t) {
          return t && typeof t.text === "string" && t.text.indexOf("Eddie Cha") !== -1;
        });
        if (!has) {
          list.push({ id: uid(), text: EDDIE, done: false, createdAt: Date.now() });
          return true;
        }
        return false;
      }

      function migrateFromV1() {
        try {
          var raw = localStorage.getItem(STORAGE_V1);
          if (raw === null) return null;
          var arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return null;
          return arr;
        } catch (e) {
          return null;
        }
      }

      function load() {
        try {
          var raw = localStorage.getItem(STORAGE_V2);
          if (raw !== null) {
            var parsed = JSON.parse(raw);
            lists = {
              work: Array.isArray(parsed && parsed.work) ? parsed.work : [],
              personal: Array.isArray(parsed && parsed.personal) ? parsed.personal : []
            };
            if (parsed && (parsed.activeTab === "work" || parsed.activeTab === "personal")) {
              activeTab = parsed.activeTab;
            }
            if (ensureEddie(lists.work)) save();
            return;
          }

          var legacy = migrateFromV1();
          if (legacy) {
            lists = { work: legacy, personal: [] };
            ensureEddie(lists.work);
            save();
            return;
          }

          lists = {
            work: SEED_WORK.map(function (text) {
              return { id: uid(), text: text, done: false, createdAt: Date.now() };
            }),
            personal: []
          };
          save();
        } catch (e) {
          lists = { work: [], personal: [] };
        }
      }

      function save() {
        localStorage.setItem(STORAGE_V2, JSON.stringify({
          work: lists.work,
          personal: lists.personal,
          activeTab: activeTab
        }));
      }

      function openCount() {
        return todos().filter(function (t) { return !t.done; }).length;
      }

      function visibleTodos() {
        var all = todos();
        if (filter === "open") return all.filter(function (t) { return !t.done; });
        if (filter === "done") return all.filter(function (t) { return t.done; });
        return all.slice();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function updateTabUI() {
        document.querySelectorAll(".tab-btn").forEach(function (btn) {
          var on = btn.getAttribute("data-tab") === activeTab;
          btn.classList.toggle("active", on);
          btn.setAttribute("aria-selected", on ? "true" : "false");
        });
        var label = activeTab === "work" ? "Work" : "Personal";
        newTodoInput.placeholder = "Add to " + label + "…";
      }

      function setTab(tab) {
        if (tab !== "work" && tab !== "personal") return;
        if (activeTab === tab) return;
        editingId = null;
        activeTab = tab;
        save();
        updateTabUI();
        render();
      }

      function render() {
        openCountEl.textContent = String(openCount());
        var items = visibleTodos();
        var tabLabel = activeTab === "work" ? "Work" : "Personal";

        if (items.length === 0) {
          var msg = filter === "done"
            ? "No completed " + tabLabel.toLowerCase() + " tasks yet."
            : filter === "open"
              ? "All clear — nothing open in " + tabLabel + "."
              : tabLabel === "Personal"
                ? "No personal tasks yet. Add one below."
                : "No work tasks yet. Add one below.";
          listEl.innerHTML = '<li class="empty">' + msg + "</li>";
          return;
        }

        listEl.innerHTML = items.map(function (t) {
          var isEditing = editingId === t.id;
          var body = isEditing
            ? '<input class="todo-edit" data-id="' + t.id + '" value="' + escapeHtml(t.text) + '" aria-label="Edit task" />'
            : '<div class="todo-text" data-id="' + t.id + '" tabindex="0" role="button" title="Tap to edit">' + escapeHtml(t.text) + "</div>";

          return (
            '<li class="todo' + (t.done ? " done" : "") + '" data-id="' + t.id + '">' +
              '<button type="button" class="check" data-action="toggle" data-id="' + t.id + '" aria-label="' + (t.done ? "Mark incomplete" : "Mark complete") + '" aria-pressed="' + t.done + '">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
              "</button>" +
              '<div class="todo-body">' + body + "</div>" +
              '<div class="actions">' +
                '<button type="button" class="icon-btn" data-action="edit" data-id="' + t.id + '" aria-label="Edit" title="Edit">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' +
                "</button>" +
                '<button type="button" class="icon-btn delete" data-action="delete" data-id="' + t.id + '" aria-label="Delete" title="Delete">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
                "</button>" +
              "</div>" +
            "</li>"
          );
        }).join("");

        if (editingId) {
          var editInput = listEl.querySelector(".todo-edit");
          if (editInput) {
            editInput.focus();
            editInput.setSelectionRange(editInput.value.length, editInput.value.length);
          }
        }
      }

      function addTodo(text) {
        var trimmed = text.trim();
        if (!trimmed) return;
        var next = todos().slice();
        next.unshift({ id: uid(), text: trimmed, done: false, createdAt: Date.now() });
        setTodos(next);
        save();
        render();
      }

      function toggleTodo(id) {
        var t = todos().find(function (x) { return x.id === id; });
        if (!t) return;
        t.done = !t.done;
        save();
        render();
      }

      function deleteTodo(id) {
        setTodos(todos().filter(function (x) { return x.id !== id; }));
        if (editingId === id) editingId = null;
        save();
        render();
      }

      function startEdit(id) {
        editingId = id;
        render();
      }

      function commitEdit(id, value) {
        var t = todos().find(function (x) { return x.id === id; });
        editingId = null;
        if (!t) { render(); return; }
        var trimmed = value.trim();
        if (!trimmed) {
          deleteTodo(id);
          return;
        }
        t.text = trimmed;
        save();
        render();
      }

      function clearCompleted() {
        var before = todos().length;
        setTodos(todos().filter(function (t) { return !t.done; }));
        if (todos().length === before) return;
        save();
        render();
      }

      addForm.addEventListener("submit", function (e) {
        e.preventDefault();
        addTodo(newTodoInput.value);
        newTodoInput.value = "";
        newTodoInput.blur();
      });

      clearBtn.addEventListener("click", clearCompleted);

      document.querySelectorAll(".tab-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTab(btn.getAttribute("data-tab"));
        });
      });

      document.querySelectorAll(".filter-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          filter = btn.getAttribute("data-filter");
          document.querySelectorAll(".filter-btn").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
          render();
        });
      });

      listEl.addEventListener("click", function (e) {
        var actionEl = e.target.closest("[data-action]");
        if (actionEl) {
          var action = actionEl.getAttribute("data-action");
          var id = actionEl.getAttribute("data-id");
          if (action === "toggle") toggleTodo(id);
          else if (action === "delete") deleteTodo(id);
          else if (action === "edit") startEdit(id);
          return;
        }
        var textEl = e.target.closest(".todo-text");
        if (textEl) startEdit(textEl.getAttribute("data-id"));
      });

      listEl.addEventListener("keydown", function (e) {
        if (e.target.classList.contains("todo-text") && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          startEdit(e.target.getAttribute("data-id"));
        }
        if (e.target.classList.contains("todo-edit")) {
          if (e.key === "Enter") {
            e.preventDefault();
            commitEdit(e.target.getAttribute("data-id"), e.target.value);
          } else if (e.key === "Escape") {
            editingId = null;
            render();
          }
        }
      });

      listEl.addEventListener("focusout", function (e) {
        if (e.target.classList.contains("todo-edit")) {
          var id = e.target.getAttribute("data-id");
          var value = e.target.value;
          setTimeout(function () {
            if (editingId === id) commitEdit(id, value);
          }, 0);
        }
      });

      load();
      updateTabUI();
      render();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
