<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Work and personal to-dos — There's always Moh to do" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Moh to do" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <title>There's always Moh to do</title>
  <style>
    :root {
      --bg: #000000;
      --bg-elevated: #0a0a0a;
      --bg-input: #111111;
      --surface: #141414;
      --border: #2a2a2a;
      --border-soft: #3a3a3a;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #ffffff;
      --accent-hover: #e8e8e8;
      --accent-soft: rgba(255, 255, 255, 0.12);
      --accent-on: #000000;
      --danger-soft: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      --radius: 14px;
      --radius-sm: 10px;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --tap: 44px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --add-bar-h: calc(72px + var(--safe-bottom));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      padding:
        calc(12px + var(--safe-top))
        calc(12px + var(--safe-right))
        calc(var(--add-bar-h) + 12px)
        calc(12px + var(--safe-left));
      min-height: 100dvh;
      overscroll-behavior-y: contain;
    }
    .app {
      max-width: 560px; margin: 0 auto; width: 100%;
      padding-bottom: calc(var(--add-bar-h) + 28px);
    }
    header { text-align: center; margin-bottom: 16px; padding: 4px 4px 0; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text);
      background: transparent; border: 1px solid var(--border-soft);
      padding: 6px 12px; border-radius: 999px; margin-bottom: 10px; min-height: 28px;
    }
    h1 {
      font-size: clamp(1.35rem, 5.5vw, 1.85rem);
      font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px;
    }
    .subtitle { color: var(--text-muted); font-size: 0.88rem; }
    .sync-line { margin-top: 6px; font-size: 0.75rem; color: var(--text-muted); min-height: 1.1em; }
    .tabs {
      display: flex; gap: 0; margin-bottom: 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; background: var(--bg-elevated);
    }
    .tab-btn {
      flex: 1; background: transparent; border: none; color: var(--text-muted);
      font-family: inherit; font-size: 0.95rem; font-weight: 700;
      min-height: var(--tap); padding: 12px 16px; cursor: pointer;
      letter-spacing: 0.02em;
    }
    .tab-btn + .tab-btn { border-left: 1px solid var(--border); }
    .tab-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .tab-btn.active { background: var(--accent); color: var(--accent-on); }
    .card {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .count { font-size: 0.85rem; color: var(--text-muted); }
    .count strong { color: var(--text); font-weight: 600; }
    .filters {
      display: flex; gap: 4px; background: var(--bg); padding: 4px;
      border-radius: 12px; border: 1px solid var(--border);
      width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .filter-btn {
      flex: 0 0 auto; background: transparent; border: none; color: var(--text-muted);
      font-family: inherit; font-size: 0.78rem; font-weight: 600;
      min-height: 40px; padding: 8px 12px; border-radius: 999px; cursor: pointer;
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { background: var(--accent); color: var(--accent-on); }
    .list { list-style: none; min-height: 140px; }
    .empty { padding: 48px 24px; text-align: center; color: var(--text-muted); font-size: 0.95rem; }
    .todo {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 12px 12px; border-bottom: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }
    .todo:last-child { border-bottom: none; }
    .todo.needs_input { box-shadow: inset 3px 0 0 #ffffff; }
    .todo.in_progress { box-shadow: inset 3px 0 0 #666666; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .check {
      flex-shrink: 0; width: var(--tap); height: var(--tap);
      border: 2px solid var(--border-soft); border-radius: 10px;
      background: transparent; cursor: pointer; display: grid; place-items: center;
      color: transparent; margin-top: 2px;
    }
    .check:hover { border-color: var(--accent); }
    .todo.completed .check { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
    .todo.in_progress .check { color: var(--text); border-color: var(--text); }
    .todo.needs_input .check { color: var(--text); border-style: dashed; }
    .check svg { width: 18px; height: 18px; }
    .todo-body { flex: 1; min-width: 0; padding-top: 8px; }
    .todo-text { font-size: 1rem; word-wrap: break-word; cursor: text; padding: 2px 0; min-height: 24px; }
    .todo.completed .todo-text { text-decoration: line-through; color: var(--text-muted); }
    .todo-notes {
      margin-top: 4px; font-size: 0.8rem; color: var(--text-muted); white-space: pre-wrap; word-wrap: break-word;
    }
    .todo-edit, .todo-notes-edit {
      width: 100%; background: var(--bg-input); border: 1px solid var(--accent);
      border-radius: 8px; color: var(--text); font-family: inherit; font-size: 1rem;
      padding: 10px 12px; outline: none; box-shadow: 0 0 0 3px var(--accent-soft); min-height: var(--tap);
    }
    .todo-notes-edit { margin-top: 8px; font-size: 0.85rem; min-height: 64px; resize: vertical; box-shadow: none; }
    .todo-side { display: flex; flex-direction: column; align-items: stretch; gap: 4px; flex-shrink: 0; }
    .status-select {
      appearance: none; -webkit-appearance: none;
      background: var(--bg-input) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='white' d='M1 1l5 5 5-5'/></svg>") no-repeat right 8px center;
      color: var(--text); border: 1px solid var(--border-soft); border-radius: 8px;
      font-family: inherit; font-size: 0.72rem; font-weight: 600;
      padding: 8px 22px 8px 8px; min-height: 36px; max-width: 124px; cursor: pointer;
    }
    .status-select:focus { outline: none; border-color: var(--accent); }
    .actions { display: flex; gap: 0; }
    .icon-btn {
      width: 40px; height: 40px; border: none; border-radius: 10px;
      background: transparent; color: var(--text-muted); cursor: pointer;
      display: grid; place-items: center;
    }
    .icon-btn:hover, .icon-btn:focus-visible { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .icon-btn.delete:hover, .icon-btn.delete:focus-visible {
      background: var(--danger-soft); color: var(--text); outline: 1px solid var(--border-soft);
    }
    .icon-btn svg { width: 18px; height: 18px; }
    footer {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); flex-wrap: wrap;
      scroll-margin-bottom: calc(var(--add-bar-h) + 16px);
    }
    .footer-hint { font-size: 0.72rem; color: var(--text-muted); line-height: 1.3; flex: 1; min-width: 140px; }
    .footer-actions { display: flex; gap: 4px; flex-wrap: wrap; }
    .btn {
      border: none; border-radius: var(--radius-sm); font-family: inherit;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; white-space: nowrap; min-height: var(--tap);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent); color: var(--accent-on); padding: 0 20px;
      flex-shrink: 0; min-width: 72px; border: 1px solid var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost {
      background: transparent; color: var(--text-muted); padding: 8px 10px;
      font-size: 0.78rem; min-height: 40px; border: 1px solid transparent; border-radius: var(--radius-sm);
      font-family: inherit; font-weight: 600; cursor: pointer;
    }
    .btn-ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); border-color: var(--border); }
    .add-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      padding: 10px calc(12px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(12px + var(--safe-left));
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.72) 0%, var(--bg) 35%);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
    }
    .add-bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: stretch; }
    .add-bar input {
      flex: 1; min-width: 0; background: var(--bg-input); border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm); color: var(--text); font-size: 16px;
      padding: 12px 14px; outline: none; min-height: var(--tap);
    }
    .add-bar input::placeholder { color: var(--text-muted); opacity: 0.7; }
    .add-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .sync-form {
      display: flex; gap: 8px; margin-top: 10px; align-items: stretch;
    }
    .sync-form[hidden] { display: none; }
    .sync-form input {
      flex: 1; min-width: 0; background: var(--bg-input); border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm); color: var(--text); font-size: 16px;
      padding: 10px 12px; outline: none; min-height: var(--tap);
    }
    .sync-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .sync-dismiss {
      background: transparent; color: var(--text-muted); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-family: inherit; font-weight: 600;
      min-height: var(--tap); padding: 0 12px; cursor: pointer;
    }
    .sync-dismiss:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="badge">To-Do</div>
      <h1>There's always Moh to do</h1>
      <p class="subtitle">Work &amp; personal</p>
      <p class="sync-line" id="syncLine" aria-live="polite">Loading shared list…</p>
      <form id="syncForm" class="sync-form" hidden autocomplete="off">
        <input type="password" id="syncPass" name="sync-passphrase" placeholder="Sync passphrase" aria-label="Sync passphrase" maxlength="200" autocomplete="current-password" />
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="sync-dismiss" id="syncDismiss">Not now</button>
      </form>
    </header>

    <div class="tabs" role="tablist" aria-label="Lists">
      <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="work" id="tabWork">Work</button>
      <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="personal" id="tabPersonal">Personal</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <p class="count"><strong id="openCount">0</strong> open</p>
        <div class="filters" role="tablist" aria-label="Filter by status">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="not_started">Not started</button>
          <button type="button" class="filter-btn" data-filter="in_progress">In progress</button>
          <button type="button" class="filter-btn" data-filter="needs_input">Needs input</button>
          <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>
      </div>

      <ul class="list" id="todoList" aria-live="polite"></ul>

      <footer>
        <span class="footer-hint">Tap text to edit. Status is per task. Edits sync to your other device.</span>
        <div class="footer-actions">
          <button type="button" class="btn btn-ghost" id="copyJson">Copy JSON</button>
          <button type="button" class="btn btn-ghost" id="clearCompleted">Clear completed</button>
          <button type="button" class="btn btn-ghost" id="syncSetup">Passphrase</button>
        </div>
      </footer>
    </div>
  </div>

  <form class="add-bar" id="addForm" autocomplete="off">
    <div class="add-bar-inner">
      <input type="text" id="newTodo" placeholder="Add to Work…" maxlength="500" aria-label="New task" enterkeyhint="done" />
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>

  <script type="module" src="./app.js"></script>
</body>
</html>
